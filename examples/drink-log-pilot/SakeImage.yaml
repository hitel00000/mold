resource:
  name: SakeImage
  table: sake_images
  timestamps: true
  soft_delete: false

fields:
  - name: legacy_id
    type: string
    nullable: true
    constraints:
      unique: true
  - name: owner_id
    type: int
    nullable: false
  - name: record_id
    type: int
    nullable: false
  - name: image_key
    type: blob
    nullable: true
  - name: thumbnail_key
    type: blob
    nullable: true
  - name: mime_type
    type: string
    nullable: false
  - name: file_name
    type: string
    nullable: false
  - name: display_order
    type: int
    nullable: false
    default: 0

relations:
  - name: owner
    kind: belongs_to
    target: User
    foreign_key: owner_id
  - name: record
    kind: belongs_to
    target: SakeRecord
    foreign_key: record_id

auth:
  ownership_field: owner_id
  permissions:
    create: authenticated
    read: owner
    update: owner
    delete: owner
