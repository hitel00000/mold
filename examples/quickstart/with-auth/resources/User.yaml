resource:
  name: User
  table: users
  timestamps: true
  soft_delete: true

fields:
  - name: email
    type: email
    nullable: true
    constraints:
      unique: true
  - name: password
    type: password
    nullable: true
    constraints:
      min_length: 8
  - name: name
    type: string
    nullable: true
  - name: provider
    type: string
    nullable: true
  - name: provider_user_id
    type: string
    nullable: true
  - name: role
    type: enum
    nullable: false
    default: "user"
    client_writable: false
    constraints:
      values: ["admin", "user"]

constraints:
  unique_together:
    - [provider, provider_user_id]

auth:
  ownership_field: id
  permissions:
    create: public
    read: authenticated
    update: owner
    delete: role:admin
